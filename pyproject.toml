[project]
name = "cryptopayments"
version = "0.1.0"
description = "A pluggable library for accepting cryptocurrency payments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cryptopayments --cov-report=term-missing"

[tool.coverage.run]
source = ["src/cryptopayments"]
